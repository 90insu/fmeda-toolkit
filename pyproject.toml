[project]
name = "fmeda-toolkit"
version = "0.1.0"
description = "ISO 26262-5 hardware architectural metrics from a versioned failure-rate table"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Insoo" }]
keywords = ["iso26262", "functional-safety", "fmeda", "automotive", "asil", "spfm", "lfm", "pmhf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "pandas>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fmeda = "fmeda.__main__:main"

[project.urls]
Homepage = "https://github.com/90insu/fmeda-toolkit"
Issues = "https://github.com/90insu/fmeda-toolkit/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
  # str+Enum is deliberate: pydantic and PyYAML round-trip these by value,
  # and StrEnum would change str() semantics across the codebase.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
