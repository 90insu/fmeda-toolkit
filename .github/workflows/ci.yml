name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dashboard,dev]"
      - run: ruff check .
      - run: pytest -q

  metrics:
    # Guards the published figures. A change that moves SPFM on the worked
    # example shows up as a diff in the PR, not as a surprise six months later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Compute metrics for the worked example
        run: |
          for level in nominal conservative worst_case; do
            echo "--- $level"
            python -m fmeda compute examples/bjb/fmeda.yaml --level "$level" --json
          done
